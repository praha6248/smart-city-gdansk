<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }
    </style>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body> 
    <div id = "map"></div>
    <script>
        var map = L.map('map', {
            minZoom: 12,
            maxBounds: L.latLngBounds([54.20, 18.25], [54.50, 19]),
        }
        ).setView([54.36 ,18.71], 12);
        L.tileLayer('https://api.maptiler.com/maps/streets-v4/{z}/{x}/{y}.png?key=17PfRx5orX5Coeuq1LPW', {
            attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
        }).addTo(map);
        
        var geojsonLayer;
        var DaneDzielnic = {};

        function dzielnice(feature) {
                    return {
                            color: "#fb6f92",
                            weight: 2,
                            fillColor: "#fb6f92",
                            fillOpacity: 0.1,
                        };
                }
        
        fetch('ludnosc.json')
            .then(response => response.json())
            .then(statsData => {
                statsData.forEach(dzielnica => {
                    const nazwa = dzielnica.NAZWA;

                    if (nazwa) {
                        DaneDzielnic[nazwa] = {
                            populacja: dzielnica["liczba  ludności 2024 r."],
                            powierzchnia: dzielnica["pow. w km2 2024 r."],
                            kobiety: dzielnica["liczba kobiet"],
                            mezczyzni: dzielnica["liczba mężczyzn"],
                        };
                    }
                });

                return fetch('Dzielnice.geojson');
            })
            .then(response => response.json())
            .then(data => {
                geojsonLayer = L.geoJSON(data, {
                    style: dzielnice,

                    onEachFeature: function(feature, layer) {

                        var nazwa = feature.properties.NAZWA;
                        var statystyki = DaneDzielnic[nazwa];

                        var trescPopup = "Dzielnica: <b>" + nazwa + "</b>";

                        if (statystyki) {
                            trescPopup += "<br>Liczba  ludności (2024): " + statystyki.populacja + " osób";
                            trescPopup += "<br>W tym: "
                            trescPopup += "<br>" + statystyki.kobiety + " kobiet,";
                            trescPopup += "<br>" + statystyki.mezczyzni + " mężczyzn";
                            trescPopup += "<br>Powierzchnia (2024): " + statystyki.powierzchnia + " km2";
                        }

                        layer.bindPopup(trescPopup);

                        layer.on({
                            mouseover: function(e) {
                                var layer = e.target;

                                layer.setStyle({
                                    color: "#fb6f92",
                                    weight: 2,
                                    fillColor: "#fb6f92",
                                    fillOpacity: 0.5,
                                });
                                layer.bringToFront();
                            },

                            mouseout: function(e) {
                                geojsonLayer.resetStyle(e.target);
                            },
                        });
                    }
                })
                .addTo(map)
            })
    </script>
</body>
</html>
