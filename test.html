<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }
    </style>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body> 
    <div id = "map"></div>
    <script>
        var map = L.map('map', {
            minZoom: 12,
            maxBounds: L.latLngBounds([54.20, 18.25], [54.50, 19]),
        }
        ).setView([54.36 ,18.71], 12);
        L.tileLayer('https://api.maptiler.com/maps/streets-v4/{z}/{x}/{y}.png?key=17PfRx5orX5Coeuq1LPW', {
            attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
        }).addTo(map);
        
        var geojsonLayer;

        fetch('Dzielnice.geojson')
            .then(response => response.json())
            .then(data => {

                function dzielnice(feature) {
                    return {
                            color: "#fb6f92",
                            weight: 2,
                            fillColor: "#fb6f92",
                            fillOpacity: 0.1,
                        };
                }

                geojsonLayer = L.geoJSON(data, {
                    style: dzielnice,

                    onEachFeature: function(feature, layer) {

                        layer.on({

                            mouseover: function(e) {
                                var layer = e.target;

                                layer.setStyle({
                                    color: "#fb6f92",
                                    weight: 2,
                                    fillColor: "#fb6f92",
                                    fillOpacity: 0.5,
                                });
                            },

                            mouseout: function(e) {
                                geojsonLayer.resetStyle(e.target);
                            },
                        })
                        if (feature.properties && feature.properties.NAZWA) {
                            layer.bindPopup("Dzielnica: <b>" + feature.properties.NAZWA + "</b>")
                        }
                    }
                })
                .addTo(map);
            });
    </script>
</body>
</html>
